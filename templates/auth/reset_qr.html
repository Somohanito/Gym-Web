{% extends 'base.html' %}

{% block content %}
<div class="login-page-bg">
    <div class="login-glass-card">
        <div class="text-center mb-4">
            <div class="mb-2">
                <span style="font-size: 2.5rem; display: inline-block;">🔑</span>
            </div>
            <h3 class="fw-bold text-white mb-1">Restablecer Contraseña</h3>
            <p class="text-light small opacity-75">Ingresa tu usuario/teléfono y pide al Entrenador o Recepción su QR Maestro</p>
        </div>

        <!-- INPUT USERNAME -->
        <div class="form-floating mb-3">
            <input type="text" id="username" class="form-control glass-input" placeholder="Tu Usuario o Teléfono">
            <label for="username">👤 Tu Usuario o Teléfono</label>
        </div>

        <!-- INPUT NUEVA CONTRASEÑA -->
        <div class="form-floating mb-4">
            <input type="password" id="new_password" class="form-control glass-input" placeholder="Nueva Contraseña">
            <label for="new_password">🔒 Nueva Contraseña</label>
        </div>

        <!-- BOTÓN DE ESCANEAR -->
        <button id="btn-scan" class="btn btn-warning w-100 fw-bold py-3 shadow mb-3 text-dark">
            📷 Escanear QR Maestro de Autorización
        </button>

        <!-- LECTOR QR Y MENSAJES -->
        <div id="reader" style="width: 100%; min-height: 250px; display: none;" class="mb-3 rounded overflow-hidden border border-secondary"></div>
        <div id="status-msg"></div>

        <div class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}" class="text-light small opacity-75 hover-underline text-decoration-none">
                ← Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    const btnScan = document.getElementById('btn-scan');
    const readerDiv = document.getElementById('reader');
    const statusMsg = document.getElementById('status-msg');

    btnScan.addEventListener('click', () => {
        const username = document.getElementById('username').value.trim();
        const newPassword = document.getElementById('new_password').value.trim();

        if (!username || !newPassword) {
            statusMsg.innerHTML = `<div class="alert alert-warning">Por favor ingresa tu usuario/teléfono y la nueva contraseña antes de escanear.</div>`;
            return;
        }

        // 1. Verificar si el usuario existe en la base de datos antes de abrir la cámara
        fetch('/check-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username })
        })
        .then(res => res.json())
        .then(data => {
            if (!data.exists) {
                statusMsg.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                return;
            }

            statusMsg.innerHTML = `<div class="alert alert-info">Usuario confirmado: <strong>${data.nombre}</strong>. Escanea el QR Maestro ahora.</div>`;
            readerDiv.style.display = 'block';

            // 2. Iniciar la cámara para escanear el QR Maestro
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (qrCodeMessage) => {
                    html5QrCode.stop();
                    readerDiv.style.display = 'none';
                    
                    fetch('/reset-password-qr', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username,
                            new_password: newPassword,
                            master_qr: qrCodeMessage
                        })
                    })
                    .then(res => res.json())
                    .then(resData => {
                        if(resData.success) {
                            statusMsg.innerHTML = `<div class="alert alert-success mt-3">${resData.message} Redirigiendo...</div>`;
                            setTimeout(() => window.location.href = '/login', 2000);
                        } else {
                            statusMsg.innerHTML = `<div class="alert alert-danger mt-3">${resData.message}</div>`;
                        }
                    });
                }
            ).catch(err => {
                alert("Error al abrir la cámara: " + err);
            });
        });
    });
</script>
{% endblock %}
